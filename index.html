<style>
  :root{
    --paper:#F6F2EA; --card:#FFFDF8; --ink:#2B2822; --muted:#8B8272;
    --line:#E5DDCC; --accent:#476A50; --accent-soft:#E3EAE0; --on-accent:#FBFAF5;
    --done:#A89F8D; --danger:#A34E36; --danger-soft:#F4E0D8; --wbh:#A5652E; --wbh-soft:#F2E4D4;
    --chip:#EFE9DC; --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 20px rgba(60,50,30,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#191713; --card:#221F1A; --ink:#EAE4D6; --muted:#958C7A;
      --line:#332F27; --accent:#8FB89A; --accent-soft:#2A342C; --on-accent:#15201A;
      --done:#6E675A; --danger:#D08A73; --danger-soft:#3B2A23; --wbh:#D0965B; --wbh-soft:#3A2F22;
      --chip:#2B2822; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --paper:#191713; --card:#221F1A; --ink:#EAE4D6; --muted:#958C7A;
    --line:#332F27; --accent:#8FB89A; --accent-soft:#2A342C; --on-accent:#15201A;
    --done:#6E675A; --danger:#D08A73; --danger-soft:#3B2A23; --wbh:#D0965B; --wbh-soft:#3A2F22;
    --chip:#2B2822; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC',-apple-system,'PingFang HK',sans-serif;
    font-size:16px; line-height:1.55;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 130px}
  header{margin:6px 2px 14px; display:flex; align-items:flex-start; gap:12px}
  .head-left{flex:1; min-width:0}
  .head-logo{
    flex:none; width:52px; height:52px; object-fit:contain; margin-top:2px;
    border-radius:10px;
  }
  .brand{font-size:12px; letter-spacing:.35em; color:var(--muted); font-weight:500}
  .date-line{
    font-family:'Noto Serif TC',serif; font-weight:900; font-size:30px;
    line-height:1.2; margin-top:2px; text-wrap:balance;
  }
  .num{
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .sync{font-size:12px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:6px}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--done); flex:none}
  .dot.ok{background:var(--accent)}
  .dot.err{background:var(--danger)}
  .banner{
    display:none; background:var(--wbh-soft); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px;
  }
  .banner.show{display:block}
  /* 版面切換 */
  .tabs{
    position:sticky; top:0; z-index:5; background:var(--paper);
    padding:6px 0 10px; display:flex; gap:8px;
  }
  .tab{
    flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--muted);
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px;
    padding:10px 0; border-radius:12px; cursor:pointer; position:relative;
  }
  .tab.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .tab .badge{
    font-family:'Noto Sans TC',sans-serif; font-size:12px; font-weight:700;
    margin-left:6px; opacity:.85;
  }
  .view{display:none}
  .view.on{display:block}
  section{margin-top:22px}
  h2{
    font-family:'Noto Serif TC',serif; font-size:15px; font-weight:700; margin:0 0 10px;
    display:flex; align-items:baseline; gap:8px;
  }
  h2 .count{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif; font-size:12px; color:var(--muted); font-weight:500}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .group-label{
    font-size:12px; color:var(--muted); letter-spacing:.15em; font-weight:700;
    padding:10px 14px 2px;
  }
  .task{
    display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
    border-top:1px solid var(--line);
  }
  .task:first-child, .group-label + .task{border-top:none}
  .tick{
    flex:none; width:24px; height:24px; margin-top:1px; border-radius:50%;
    border:2px solid var(--muted); background:transparent; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px;
    transition:background .18s, border-color .18s, color .18s;
  }
  .task.done .tick{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .task-body{flex:1; min-width:0}
  .task-text{word-break:break-word; transition:color .25s}
  .task.done .task-text{color:var(--done); text-decoration:line-through; text-decoration-thickness:1.5px}
  .task-meta{display:flex; gap:6px; margin-top:6px; align-items:center; flex-wrap:wrap}
  .chip{
    font-size:12px; border:none; border-radius:999px; padding:4px 10px; cursor:pointer;
    background:var(--chip); color:var(--muted); font-family:inherit; line-height:1.3;
  }
  .chip.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
  .chip.warn{background:var(--danger-soft); color:var(--danger); font-weight:700}
  .chip.cal-pending{background:var(--wbh-soft); color:var(--wbh); font-weight:700}
  .chip.imp{box-shadow:inset 0 0 0 1.5px var(--danger); background:transparent; color:var(--danger); font-weight:700}
  .chip.imp.on{background:var(--danger); color:#FFFDF8; box-shadow:none}
  .stamp{font-size:12px; color:var(--muted)}
  .del{
    flex:none; border:none; background:none; color:var(--muted); font-size:16px;
    cursor:pointer; padding:2px 6px; margin-top:1px; opacity:.6; border-radius:8px;
    font-family:inherit;
  }
  .del.arm{
    opacity:1; background:var(--danger); color:#FFF; font-size:12px; font-weight:700;
    padding:4px 8px;
  }
  .editor{
    padding:12px 14px; background:var(--accent-soft);
    border-top:1px dashed var(--line); font-size:14px;
  }
  .ed-field{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .ed-field label{flex:none; width:76px; font-size:13px; color:var(--muted)}
  .editor input{
    flex:1; min-width:0; font-size:16px; font-family:inherit; padding:8px 10px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none;
  }
  .ed-hint{font-size:12px; color:var(--muted); margin:2px 0 10px}
  .ed-actions{display:flex; align-items:center; gap:12px}
  .editor .save{
    border:none; border-radius:9px; padding:8px 16px; font-size:14px; font-weight:700;
    font-family:inherit; background:var(--accent); color:var(--on-accent); cursor:pointer;
  }
  .editor .cancel{
    border:none; background:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:inherit;
  }
  .empty{padding:20px 14px; color:var(--muted); font-size:14px; text-align:center}
  .sort-row{display:flex; align-items:center; gap:6px; margin:0 2px 10px}
  .sort-label{font-size:12px; color:var(--muted); letter-spacing:.15em; margin-right:2px}
  .sort-row .chip.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
  /* 時間表 */
  .day{border-top:1px solid var(--line)}
  .day:first-child{border-top:none}
  .day-head{display:flex; align-items:baseline; gap:8px; padding:11px 14px 4px}
  .day-name{font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px}
  .day-name.today-mark{color:var(--accent)}
  .day-date{font-size:12px; color:var(--muted)}
  .ev{display:flex; gap:12px; padding:7px 14px}
  .ev:last-child{padding-bottom:13px}
  .ev-time{
    flex:none; width:88px; font-size:13px; color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans TC',sans-serif;
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .ev-card{
    flex:1; border-left:3px solid var(--accent); background:var(--accent-soft);
    border-radius:6px; padding:6px 10px; font-size:14px;
  }
  .ev-card.wbh{border-left-color:var(--wbh); background:var(--wbh-soft)}
  .ev-card.plan{border-left-style:dashed; border-left-color:var(--wbh); background:var(--wbh-soft)}
  .ev-card.due{border-left-color:var(--danger); background:var(--danger-soft)}
  .ev-tag{font-size:11px; color:var(--muted); margin-left:6px}
  .no-ev{padding:6px 14px 13px; color:var(--muted); font-size:13px}
  /* 紀錄 */
  .note-day{border-top:1px solid var(--line); padding:11px 14px}
  .note-day:first-child{border-top:none}
  .note-date{font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px; margin-bottom:4px}
  .note-item{font-size:14px; padding:3px 0 3px 14px; position:relative; color:var(--ink)}
  .note-item::before{content:''; position:absolute; left:2px; top:.7em; width:5px; height:5px; border-radius:50%; background:var(--accent)}
  .weekly-item{padding:11px 14px; border-top:1px solid var(--line); font-size:14px}
  .weekly-item:first-child{border-top:none}
  .weekly-wk{font-weight:700; color:var(--accent); font-size:13px; margin-bottom:3px}
  .foot{margin-top:30px; font-size:12px; color:var(--muted); text-align:center; line-height:1.8}
  .more-btn{
    display:block; width:100%; border:none; background:none; color:var(--accent);
    font-family:inherit; font-size:13px; padding:10px; cursor:pointer; border-top:1px solid var(--line);
  }
  /* 底部隨手記 */
  .capture{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:var(--paper); border-top:1px solid var(--line);
  }
  .capture-inner{max-width:560px; width:100%; margin:0 auto; display:flex; gap:8px}
  .capture input{
    flex:1; min-width:0; font-size:16px; font-family:inherit; padding:11px 12px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink); outline:none;
  }
  .capture input:focus{border-color:var(--accent)}

    <button class="tab" data-view="notes" id="tabNotes">紀錄</button>

  <div class="view" id="viewSched">
    <section>
      <h2>一週時間表 <span class="count" id="schedStamp"></span></h2>

    </section>

    <section>
      <h2>未做 <span class="count" id="todoCount"></span></h2>
      <div class="sort-row">
        <span class="sort-label">排序</span>
        <button class="chip" data-sort="imp" id="sortImp">重要事項</button>
        <button class="chip" data-sort="due" id="sortDue">死線</button>
        <button class="chip" data-sort="ct" id="sortCt">加入時間</button>
      </div>
      <div class="card" id="todoList"></div>
    </section>
    <section>
      <h2>完成咗 <span class="count" id="doneCount"></span></h2>
      <div class="card" id="doneList"></div>
    </section>
  </div>

  <div class="view" id="viewNotes">
    <section>
      <h2>每週回顧</h2>
      <div class="card" id="weeklyList"></div>
    </section>
    <section>
      <h2>傾過嘅嘢 <span class="count">Eva 每個 session 幫你記</span></h2>
      <div class="card" id="notesList"></div>
    </section>

    <button id="captureBtn">記低</button>
  </div>
</div>


<script>
(function(){
  'use strict';
  // 共用雲端資料庫（Supabase）——你同曉明同一個 app、實時同步
  var SB = 'https://lvwspnjysfyomuszzjay.supabase.co';
  var SBK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2d3Nwbmp5c2Z5b211c3p6amF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODIxMzIsImV4cCI6MjEwMTA1ODEzMn0.fmrc8DlO1UXcsLnUdhTG6IZyxv1kZEVP8jSEIQgf2d4';

  var BKEY = '';
  try{ BKEY = localStorage.getItem('boardKey') || ''; }catch(e){}
  function askKey(msg){
    var k = prompt(msg || '輸入暗號（問 Franki 攞）');
    if(k){ BKEY = k.trim(); try{ localStorage.setItem('boardKey', BKEY); }catch(e){} }
    return !!BKEY;
  }

  var state = null, lastUpdated = null;
  var dirty = false, publishTimer = null;
  var showAllDone = false;
  var sortMode = 'imp';
  try{ sortMode = localStorage.getItem('sortMode') || 'imp'; }catch(e){}
  if(['imp','due','ct'].indexOf(sortMode) < 0) sortMode = 'imp';
  var editing = null;          // {id, kind: 'mins'|'due'|'plan'}
  var armedDel = null, armedTimer = null;

  var $ = function(id){ return document.getElementById(id); };
  var WEEK = ['日','一','二','三','四','五','六'];

  function pad(n){ return (n<10?'0':'')+n; }
  function localDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function mmdd(iso){ return iso ? iso.slice(5,10).replace('-','/') : ''; }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  // 數字用返 iPhone 系統字型
  function nw(s){
    return String(s).replace(/[0-9]+(?:[:\/.-][0-9]+)*/g, function(m){ return '<span class="num">'+m+'</span>'; });
  }

  function setSync(cls, text){
    var dot = $('syncDot');
    dot.className = 'dot' + (cls ? ' '+cls : '');
    $('syncText').textContent = text;
  }

  // ---------- 版面切換 ----------
  function setView(v){
    ['sched','tasks','notes'].forEach(function(k){
      var view = k==='sched' ? 'viewSched' : k==='tasks' ? 'viewTasks' : 'viewNotes';
      var tab = k==='sched' ? 'tabSched' : k==='tasks' ? 'tabTasks' : 'tabNotes';
      $(view).classList.toggle('on', k===v);
      $(tab).classList.toggle('on', k===v);
    });
    try{ localStorage.setItem('view', v); }catch(e){}
  }
  $('tabSched').addEventListener('click', function(){ setView('sched'); });
  $('tabTasks').addEventListener('click', function(){ setView('tasks'); });
  $('tabNotes').addEventListener('click', function(){ setView('notes'); });

  // ---------- render ----------
  function fmtHeader(){
    var n = new Date();
    return nw(n.getMonth()+1)+'月'+nw(n.getDate())+'日（'+WEEK[n.getDay()]+'）· '+nw(pad(n.getHours())+':'+pad(n.getMinutes()));
  }
  function render(){
    if(!state) return;
    var now = new Date();
    var today = localDateStr(now);
    $('dateLine').innerHTML = fmtHeader();

    var todos = state.tasks.filter(function(t){ return !t.done; });
    var dones = state.tasks.filter(function(t){ return t.done; })
      .sort(function(a,b){ return (b.doneAt||'') < (a.doneAt||'') ? -1 : 1; });

    var isToday = function(t){
      return (t.plan && t.plan.date === today) || t.due === today;
    };
    var dtKey = function(t){ return (t.created||'') + ' ' + (t.ct||'00:00'); };
    var cmp = function(a,b){
      if(sortMode === 'due'){
        var da = a.due || '9999-99-99', db = b.due || '9999-99-99';
        if(da !== db) return da < db ? -1 : 1;
      } else if(sortMode === 'imp'){
        var d0 = (b.imp?1:0) - (a.imp?1:0);
        if(d0 !== 0) return d0;
      }
      var ka = dtKey(a), kb = dtKey(b);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    };
    var todayTasks = todos.filter(isToday).sort(cmp);
    var laterTasks = todos.filter(function(t){ return !isToday(t); }).sort(cmp);
    ['sortImp','sortDue','sortCt'].forEach(function(id){
      var el = $(id);
      if(el) el.classList.toggle('on', el.getAttribute('data-sort') === sortMode);
    });
    var h = '';
    if(!todos.length){
      h = '<div class="empty">乜都清晒 ✨ 諗到嘢就喺下面記低</div>';
    } else {
      if(todayTasks.length){
        h += '<div class="group-label">今日</div>' + todayTasks.map(function(t){ return taskRow(t, today); }).join('');
      }
      if(laterTasks.length){
        h += '<div class="group-label">之後</div>' + laterTasks.map(function(t){ return taskRow(t, today); }).join('');
      }
    }
    $('todoList').innerHTML = h;
    $('todoCount').textContent = todos.length ? todos.length+' 項' : '';

    var shown = showAllDone ? dones : dones.slice(0,12);
    var dh = dones.length
      ? shown.map(function(t){ return taskRow(t, today); }).join('') +
        (dones.length > 12 && !showAllDone
          ? '<button class="more-btn" data-act="more">顯示全部 '+dones.length+' 項</button>' : '')
      : '<div class="empty">未有完成紀錄</div>';
    $('doneList').innerHTML = dh;
    $('doneCount').textContent = dones.length ? dones.length+' 項' : '';

    renderSched(today);
    renderNotes();

    // 掛返 editor 嘅初始值
    if(editing){
      var el = document.querySelector('.editor input');
      if(el) el.focus();
    }
  }

  function taskRow(t, today){
    var doneCls = t.done ? ' done' : '';
    var metas = [];
    if(!t.done){
      if(t.plan && t.plan.status === 'added'){
        metas.push('<button class="chip on" data-act="edit-plan" data-id="'+t.id+'">📅 '+nw(mmdd(t.plan.date))+(t.plan.time?' '+nw(t.plan.time):'')+' 已入日曆</button>');
      } else if(t.plan && t.plan.status === 'pending'){
        metas.push('<button class="chip cal-pending" data-act="edit-plan" data-id="'+t.id+'">⏳ '+nw(mmdd(t.plan.date))+(t.plan.time?' '+nw(t.plan.time):'')+' 等 Eva 入日曆</button>');
      } else {
        metas.push('<button class="chip" data-act="edit-plan" data-id="'+t.id+'">＋入日曆</button>');
      }
      metas.push('<button class="chip imp'+(t.imp?' on':'')+'" data-act="imp" data-id="'+t.id+'">'+(t.imp?'🔴 重要事項':'重要事項')+'</button>');
      if(!t.ming){
        metas.push('<button class="chip" data-act="ming" data-id="'+t.id+'">交曉明</button>');
      } else if(t.ming.status === 'pending'){
        metas.push('<button class="chip cal-pending" data-act="ming" data-id="'+t.id+'">⏳ 通知緊曉明</button>');
      } else {
        metas.push('<button class="chip on" data-act="ming" data-id="'+t.id+'">📨 '+(t.ming.at?nw(mmdd(t.ming.at))+' ':'')+'已通知曉明</button>');
      }
      if(t.due){
        metas.push('<span class="stamp" style="color:'+(t.due < today ? 'var(--danger)' : 'var(--muted)')+'">⚑ 死線 '+nw(mmdd(t.due))+'</span>');
      }
      metas.push('<span class="stamp">＋'+nw(mmdd(t.created))+(t.ct?' '+nw(t.ct):'')+'</span>');
    } else {
      if(t.doneAt) metas.push('<span class="stamp">'+nw(mmdd(t.doneAt))+' 完成</span>');
    }
    if(t.via) metas.push('<span class="stamp">'+esc(t.via)+'</span>');

    var delArm = armedDel === t.id;
    var html = '<div class="task'+doneCls+'" data-id="'+t.id+'">'+
      '<button class="tick" data-act="tick" data-id="'+t.id+'" aria-label="完成">✓</button>'+
      '<div class="task-body"><div class="task-text">'+esc(t.text)+'</div>'+
      (metas.length ? '<div class="task-meta">'+metas.join('')+'</div>' : '')+'</div>'+
      '<button class="del'+(delArm?' arm':'')+'" data-act="del" data-id="'+t.id+'" aria-label="刪除">'+(delArm?'確定刪？':'✕')+'</button>'+
      '</div>';

    if(editing && editing.id === t.id){
      html += editorRow(t);
    }
    return html;
  }

  function editorRow(t){
    var today = localDateStr(new Date());
    if(editing.kind === 'plan'){
      return '<div class="editor">'+
        '<div class="ed-field"><label>邊一日做</label><input type="date" id="edPlanDate" value="'+((t.plan&&t.plan.date)||today)+'"></div>'+
        '<div class="ed-field"><label>幾點做</label><input type="time" id="edPlanTime" value="'+((t.plan&&t.plan.time)||'')+'"></div>'+
        '<div class="ed-field"><label>⏱ 分鐘</label><input type="number" inputmode="numeric" min="5" step="5" id="edPlanMins" value="'+(t.mins||30)+'"></div>'+
        '<div class="ed-field"><label>⚑ 死線</label><input type="date" id="edPlanDue" value="'+(t.due||'')+'"></div>'+
        '<div class="ed-hint">幾點唔填＝Eva 幫你搵空檔・死線可以留空</div>'+
        '<div class="ed-actions">'+
        '<button class="save" data-act="save-plan" data-id="'+t.id+'">加入日曆</button>'+
        (t.plan ? '<button class="cancel" data-act="clear-plan" data-id="'+t.id+'">取消安排</button>' : '')+
        '<button class="cancel" data-act="cancel-edit">收埋</button></div></div>';
    }
    return '';
  }

  function renderSched(today){
    var byDay = {};
    function push(d, item){ (byDay[d] = byDay[d] || []).push(item); }

    state.events.forEach(function(ev){
      if(ev.d < today) return;
      push(ev.d, {kind:'ev', s:ev.s||'', e:ev.e||'', t:ev.t, cal:ev.cal, allDay:ev.allDay});
    });
    state.tasks.forEach(function(t){
      if(t.done) return;
      if(t.plan && t.plan.status === 'pending' && t.plan.date >= today){
        push(t.plan.date, {kind:'plan', t:t.text, mins:t.mins, time:t.plan.time});
      }
      if(t.due){
        push(t.due < today ? today : t.due, {kind:'due', t:t.text, over: t.due < today});
      }
    });

    var days = Object.keys(byDay).sort();
    if(days.indexOf(today) === -1){ days.unshift(today); days.sort(); }

    var tomorrow = localDateStr(new Date(Date.now()+864e5));
    var h = days.map(function(d){
      var dt = new Date(d+'T12:00:00');
      var name = d===today ? '今日・' : d===tomorrow ? '聽日・' : '';
      var items = (byDay[d]||[]).sort(function(a,b){
        var ka = a.kind==='due' ? '00' : (a.kind==='plan' ? (a.time||'99') : (a.allDay?'01':a.s));
        var kb = b.kind==='due' ? '00' : (b.kind==='plan' ? (b.time||'99') : (b.allDay?'01':b.s));
        return ka < kb ? -1 : 1;
      });
      var rows = items.length ? items.map(function(it){
        if(it.kind==='ev'){
          var time = it.allDay ? '全日' : esc(it.s+(it.e ? '–'+it.e : ''));
          return '<div class="ev"><div class="ev-time">'+time+'</div>'+
            '<div class="ev-card'+(it.cal==='WBH'?' wbh':'')+'">'+esc(it.t)+
            '<span class="ev-tag">'+esc(it.cal||'')+'</span></div></div>';
        }
        if(it.kind==='plan'){
          return '<div class="ev"><div class="ev-time">'+(it.time?esc(it.time)+' ⏳':'待 Eva 排')+'</div>'+
            '<div class="ev-card plan">☐ '+esc(it.t)+(it.mins?'（'+it.mins+'分）':'')+
            '<span class="ev-tag">任務</span></div></div>';
        }
        return '<div class="ev"><div class="ev-time">'+(it.over?'過咗期':'死線')+'</div>'+
          '<div class="ev-card due">⚑ '+esc(it.t)+'<span class="ev-tag">死線</span></div></div>';
      }).join('') : '<div class="no-ev">未有安排——啱啱好攞嚟做「任務」嗰啲嘢</div>';
      return '<div class="day"><div class="day-head">'+
        '<span class="day-name'+(d===today?' today-mark':'')+'">'+name+nw(dt.getMonth()+1)+'月'+nw(dt.getDate())+'日（'+WEEK[dt.getDay()]+'）</span></div>'+rows+'</div>';
    }).join('');
    $('schedList').innerHTML = h;
    $('schedStamp').textContent = state.meta.eventsUpdated
      ? 'Eva '+mmdd(state.meta.eventsUpdated)+' 更新' : '';
  }

  function renderNotes(){
    var wk = state.weekly.slice(0,4).map(function(w){
      return '<div class="weekly-item"><div class="weekly-wk">'+esc(w.wk)+'</div>'+esc(w.text)+'</div>';
    }).join('');
    $('weeklyList').innerHTML = wk || '<div class="empty">逢星期日晚 Eva 幫你埋單：今個星期完成咗啲乜</div>';

    var byDay = {};
    state.notes.forEach(function(n){ (byDay[n.d] = byDay[n.d] || []).push(n.text); });
    var days = Object.keys(byDay).sort().reverse().slice(0,14);
    var h = days.map(function(d){
      return '<div class="note-day"><div class="note-date">'+mmdd(d)+'</div>'+
        byDay[d].map(function(x){ return '<div class="note-item">'+esc(x)+'</div>'; }).join('')+'</div>';
    }).join('');
    $('notesList').innerHTML = h || '<div class="empty">未有紀錄</div>';
  }

  // ---------- persist（Supabase）----------
  function schedulePersist(){
    dirty = true;
    setSync('', '儲緊…');
    if(publishTimer) clearTimeout(publishTimer);
    publishTimer = setTimeout(persist, 700);
  }

  function persist(){
    if(!state) return;
    fetch(SB+'/rest/v1/wbh_board?on_conflict=id', {
      method:'POST',
      headers:{apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':BKEY, 'Content-Type':'application/json',
               Prefer:'resolution=merge-duplicates,return=representation'},
      body: JSON.stringify([{id:'main', state:state, updated_at:new Date().toISOString()}])
    }).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){
        dirty = false;
        if(rows && rows[0]) lastUpdated = rows[0].updated_at;
        setSync('ok', '已儲低 '+new Date().toTimeString().slice(0,5));
      })
      .catch(function(){
        setSync('err', '儲唔到，會再試');
        setTimeout(persist, 4000);
      });
  }

  function applyState(row){
    state = row.state || {};
    if(!Array.isArray(state.tasks)) state.tasks = [];
    if(!Array.isArray(state.events)) state.events = [];
    if(!Array.isArray(state.notes)) state.notes = [];
    if(!Array.isArray(state.weekly)) state.weekly = [];
    if(!state.meta) state.meta = {};
    lastUpdated = row.updated_at;
  }

  function fetchBoard(cb){
    fetch(SB+'/rest/v1/wbh_board?id=eq.main&select=state,updated_at', {
      headers:{apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':BKEY}
    }).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ cb(rows && rows[0] ? rows[0] : null); })
      .catch(function(){ cb(null); });
  }

  function refreshIfChanged(){
    if(dirty || editing || armedDel || !state) return;
    fetchBoard(function(row){
      if(row && row.updated_at !== lastUpdated){ applyState(row); render(); }
    });
  }

  // ---------- actions ----------
  function findTask(id){
    for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i];
    return null;
  }
  function disarmDel(){
    armedDel = null;
    if(armedTimer){ clearTimeout(armedTimer); armedTimer = null; }
  }

  document.addEventListener('click', function(ev){
    var sbtn = ev.target.closest('[data-sort]');
    if(sbtn){
      sortMode = sbtn.getAttribute('data-sort');
      try{ localStorage.setItem('sortMode', sortMode); }catch(e){}
      render();
      return;
    }
    var btn = ev.target.closest('[data-act]');
    if(!btn){
      if(armedDel){ disarmDel(); render(); }
      return;
    }
    var act = btn.getAttribute('data-act');
    if(act === 'more'){ showAllDone = true; render(); return; }
    if(act === 'cancel-edit'){ editing = null; render(); return; }

    var id = btn.getAttribute('data-id');
    var t = id ? findTask(id) : null;
    if(!t){ return; }

    if(act === 'tick'){
      t.done = !t.done;
      t.doneAt = t.done ? localDateStr(new Date()) : null;
      editing = null;
      if(t.done){
        var row = btn.closest('.task');
        if(row){ row.classList.add('done'); }
        setTimeout(render, 350);
      } else { render(); }
      schedulePersist();
    } else if(act === 'del'){
      if(armedDel === t.id){
        disarmDel();
        state.tasks = state.tasks.filter(function(x){ return x.id !== t.id; });
        editing = null;
        render(); schedulePersist();
      } else {
        disarmDel();
        armedDel = t.id;
        armedTimer = setTimeout(function(){ disarmDel(); render(); }, 3000);
        render();
      }
    } else if(act === 'imp'){
      t.imp = !t.imp;
      if(!t.imp) delete t.imp;
      render(); schedulePersist();
    } else if(act === 'ming'){
      if(!t.ming){ t.ming = {status:'pending'}; }
      else if(t.ming.status === 'pending'){ delete t.ming; }
      else { t.ming = {status:'pending'}; }
      render(); schedulePersist();
    } else if(act === 'edit-plan'){
      editing = {id:t.id, kind:'plan'}; render();
    } else if(act === 'save-plan'){
      var d2 = ($('edPlanDate')||{}).value;
      var tm2 = ($('edPlanTime')||{}).value;
      var m2 = parseInt(($('edPlanMins')||{}).value, 10);
      var du2 = ($('edPlanDue')||{}).value;
      if(m2 > 0) t.mins = m2;
      if(du2){ t.due = du2; } else { delete t.due; }
      if(d2){
        t.plan = {date:d2, status:'pending'};
        if(tm2) t.plan.time = tm2;
      }
      editing = null; render(); schedulePersist();
    } else if(act === 'clear-plan'){
      delete t.plan; delete t.due; editing = null; render(); schedulePersist();
    }
  });

  function addTask(){
    if(!state) return;
    var input = $('captureInput');
    var text = input.value.trim();
    if(!text) return;
    var nowD = new Date();
    state.tasks.unshift({ id:uid(), text:text, created:localDateStr(nowD), ct:pad(nowD.getHours())+':'+pad(nowD.getMinutes()), today:false, done:false, doneAt:null });
    input.value = '';
    try{ localStorage.removeItem('draft'); }catch(e){}
    setView('tasks');
    render(); schedulePersist();
    input.focus();
  }
  $('captureBtn').addEventListener('click', addTask);
  $('captureInput').addEventListener('keydown', function(e){ if(e.key==='Enter') addTask(); });
  $('captureInput').addEventListener('input', function(e){
    try{ localStorage.setItem('draft', e.target.value); }catch(err){}
  });
  try{
    var draft = localStorage.getItem('draft');
    if(draft) $('captureInput').value = draft;
  }catch(e){}

  // ---------- boot ----------
  setInterval(function(){ try{ $('dateLine').innerHTML = fmtHeader(); }catch(e){} }, 20000);
  var startView = 'sched';
  try{ startView = localStorage.getItem('view') || 'sched'; }catch(e){}
  setView(['sched','tasks','notes'].indexOf(startView) >= 0 ? startView : 'sched');
  function boot(){
    if(!BKEY && !askKey('輸入暗號開板（問 Franki 攞）')){ setSync('err', '要暗號先開到——刷新再入'); return; }
    setSync('', '載緊資料…');
    fetchBoard(function(row){
      if(!row){
        try{ localStorage.removeItem('boardKey'); }catch(e){}
        BKEY = '';
        if(askKey('暗號唔啱或者斷線——再入一次')){ boot(); return; }
        setSync('err', '連唔到——刷新再試');
        $('banner').classList.add('show');
        return;
      }
      applyState(row);
      setSync('ok', '同步已接通');
      render();
    });
  }
  boot();
  setInterval(refreshIfChanged, 5000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) refreshIfChanged();
  });
})();
</script>
